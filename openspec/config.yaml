schema: spec-rails
githubCopilot:
  cloudAgent: false

context: |
  Supported runtime targets: Chrome (MV2 and MV3), Firefox, and standalone API (`darkreader.js` / `darkreader.mjs` via `npm run api`).
  Compile-time flags (`__PLUS__`, `__THUNDERBIRD__`) and `src/stubs/` remain intact unless explicitly scoped for removal.
  Required verification gates: `npm test`, `npm run test:browser`, `npm run test:inject`, `npm run lint`, `npm run build`, and `npm run api`.
  Architecture & subsystem map: see `docs/nyx-blueprint.md`.

rules:
  proposal:
    - Scope each change to a single vertical slice; never combine runtime performance optimizations with UI or platform removals.
    - Explicitly list Out-of-Scope Non-Goals and numeric exit criteria where applicable.
  tasks:
    - Keep tasks small, independently verifiable, and gated by the required test and build suite.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-lgtm-directives
        name: check unresolved lgtm review directives
        entry: sh -c 'if [ -d .lgtm/reviews ]; then ! grep -rn "^#ref " .lgtm/reviews; fi'
        language: system
        pass_filenames: false

      - id: lint
        name: linter
        entry: npm run lint
        language: system
        pass_filenames: false

      - id: test
        name: test suite
        entry: npm test
        language: system
        pass_filenames: false

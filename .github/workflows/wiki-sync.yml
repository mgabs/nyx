name: Sync Nyx Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
      - 'docs/nyx-blueprint.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clone Nyx Wiki repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo

      - name: Sync wiki markdown pages
        run: |
          cp -f docs/wiki/*.md wiki-repo/
          cd wiki-repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: sync Nyx wiki from main (${GITHUB_SHA::7})"
          git push origin HEAD

name: Build store release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Retention duration (in days)'
        required: true
        default: '7'
      node_version:
        description: 'NodeJS version'
        required: true
        default: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version || '22.x' }}
          cache: npm

      - name: Install npm dependencies
        run: make install

      - name: Validate source
        run: make lint test-unit

      - name: Build Chrome, Firefox, Thunderbird, and Safari source
        run: make build-release ARGS="--chrome --chrome-mv3 --firefox --thunderbird"

      - name: Package Edge and verify store artifacts
        run: |
          cp build/release/nyx-chrome-mv3.zip build/release/nyx-edge.zip
          for package in nyx-chrome.zip nyx-chrome-mv3.zip nyx-edge.zip nyx-firefox.xpi nyx-thunderbird.xpi; do
            test -s "build/release/$package"
            unzip -t "build/release/$package"
          done

      - name: Upload web extension packages
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nyx-web-extensions
          path: build/release/nyx-*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || '7' }}

  safari:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download Safari source package
        uses: actions/download-artifact@v8
        with:
          name: nyx-web-extensions
          path: build/release

      - name: Generate Safari macOS Xcode project
        run: |
          unzip -q build/release/nyx-chrome.zip -d build/safari-source
          xcrun safari-web-extension-converter build/safari-source \
            --project-location build/safari --app-name Nyx \
            --bundle-identifier io.github.mgabs.Nyx --swift --macos-only \
            --copy-resources --no-open --no-prompt

      - name: Build unsigned Safari macOS app
        run: |
          xcodebuild -project build/safari/Nyx/Nyx.xcodeproj -scheme Nyx \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/safari-derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          test -d build/safari-derived/Build/Products/Release/Nyx.app
          ditto -c -k --keepParent build/safari-derived/Build/Products/Release/Nyx.app \
            build/release/nyx-safari-macos-unsigned.zip
          ditto -c -k --keepParent build/safari/Nyx build/release/nyx-safari-xcode.zip

      - name: Upload Safari packages
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nyx-safari
          path: build/release/nyx-safari-*.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || '7' }}

  release:
    needs: [build, safari]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: nyx-*
          merge-multiple: true
          path: build/release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body: |
            Chrome Web Store: nyx-chrome-mv3.zip
            Edge Add-ons: nyx-edge.zip (same Chromium MV3 build)
            Firefox Add-ons: nyx-firefox.xpi (unsigned)
            Thunderbird: nyx-thunderbird.xpi
            Safari/macOS: nyx-safari-macos-unsigned.zip and nyx-safari-xcode.zip

            These are build artifacts, not automatic store submissions.
            Safari is an experimental unsigned macOS build; Apple developer signing,
            provisioning, and App Store review are required before distribution.
            Firefox requires Mozilla signing. Safari iOS/iPadOS is not included.
          files: |
            build/release/nyx-chrome.zip
            build/release/nyx-chrome-mv3.zip
            build/release/nyx-edge.zip
            build/release/nyx-firefox.xpi
            build/release/nyx-thunderbird.xpi
            build/release/nyx-safari-macos-unsigned.zip
            build/release/nyx-safari-xcode.zip
            CHANGELOG.md
